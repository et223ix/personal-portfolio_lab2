<main id="feedback">

    <section>

    <h2>Feedback</h2>
    

    <form id="contactformsecond">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" aria-describedby="name-error">
        <p id="name-error" class="error-message"> </p>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" aria-describedby="email-error">
        <p id="email-error" class="error-message"> </p>

        <label for="topic">Topic of interests</label>

        <select id="topic" name="topic" aria-describedby="topic-error">

            <option value="" disabled selected>Choose a topic</option>

            <option value="webdesign">Web design</option>

            <option value="webdevelopment">Web development</option>

            <option value="uxdesign">Portfolio feedback</option>

            <option value="other">Other</option>

        </select>
        <p id="topic-error" class="error-message"> </p>

        <label for="message">Comments</label>
        <textarea id="message" name="message" aria-describedby="message-error"></textarea>
        <p id="comment-counter">0 characters. Minimum 15 characters.</p>
        <p id="message-error" class="error-message"> </p>

        <label for="url">Website</label>
        <input type="url" id="url" name="url" aria-describedby="url-error">
        <p id="url-error" class="error-message"> </p>
         
         <button type="submit">Submit</button>
         <button type="button" id="clearbutton">Clear</button>
       
        <div id="form-status" role="status" aria-live="polite"></div>

    </form>

    
</section>
